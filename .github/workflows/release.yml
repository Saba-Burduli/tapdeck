name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build a
# DMG and attach it to a DRAFT GitHub release for review before publishing.
#
# Optional repository secrets for a signed + notarized build:
#   DEVELOPER_ID_P12          base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD password for that .p12
#   SIGN_IDENTITY             "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
# Without them the DMG is ad-hoc signed and users approve it on first open.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # `secrets` can't be used in step `if:` conditions; expose a flag instead.
      HAS_SIGNING_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs tags for the version

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_password=$(openssl rand -hex 16)
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/package-release.sh | tee package.log

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls dist/TapDeck-*.dmg)
          sha=$(grep '^SHA-256:' package.log | cut -d' ' -f2)
          notarized=$(grep '^Notarized:' package.log | cut -d' ' -f2)
          {
            echo "## Install"
            echo "Download **$(basename "$dmg")**, open it, and drag TapDeck to Applications."
            if [ "$notarized" != "true" ]; then
              echo
              echo "> This build isn't notarized. On first open, macOS will block it: go to"
              echo "> **System Settings → Privacy & Security** and click **Open Anyway**."
            fi
            echo
            echo "SHA-256: \`$sha\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$dmg" --draft --title "TapDeck $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
